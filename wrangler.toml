# Cloudflare Pages 部署配置
# 项目名必须和 Cloudflare 上的 Pages 项目一致，否则 wrangler 会去建新项目
name = "data"
compatibility_date = "2024-11-01"

# 仓库根目录就是发布目录：根目录里的 index.html + assets/ 是 v2 前端的构建产物
# （改前端后跑 npm run build && npm run sync:root）
pages_build_output_dir = "."

# D1 数据库（Cloudflare 上已有：exam_db）
[[d1_databases]]
binding = "exam_db"
database_name = "exam_db"
database_id = "e4c77d09-fd67-4ac7-abe2-06825d26b8a8"

[vars]
# 不要在这里写密钥：ZAI_API_KEY / AUTH_SECRET 用
#   wrangler pages secret put ZAI_API_KEY --project-name data
# 或控制台 Settings → Variables and Secrets 配置
